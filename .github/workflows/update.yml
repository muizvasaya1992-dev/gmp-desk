name: Update IPO data
on:
  schedule:
    - cron: "*/20 3-12 * * 1-5"      # every 20 min, about 08:30-18:30 IST, Mon-Fri (GitHub cron is UTC)
    - cron: "23 * * * *"             # plus once an hour, every day and night, so GMP keeps moving on weekends and evenings
  workflow_dispatch: {}              # "Run workflow" button
  push:
    paths: ["data/ipos_manual.json", "data/gmp.csv", "data/config.json", "build_data.py", "pages.py"]   # new code gets used straight away
permissions:
  contents: write
concurrency:
  group: update-ipo-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                    # always the newest main, even when re-running an old run
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      # BSE refuses cloud servers (403), so only NSE is fetched here. BSE is refreshed from your PC (update_from_pc.bat).
      - run: python build_data.py --no-bse
        env:
          GMP_TRACKER_URL: ${{ secrets.GMP_TRACKER_URL }}     # kept secret, so the public repository never names the source
      - name: Commit if changed
        run: |
          git config user.name "ipo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A -- ipos.json history.json data ipo sitemap.xml
          if git diff --staged --quiet; then echo "Nothing changed, nothing to commit."; exit 0; fi
          git commit -m "Update IPO data"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push attempt $i failed, retrying in 5 seconds"
            sleep 5
          done
          exit 1
