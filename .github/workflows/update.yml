name: Update IPO data
on:
  schedule:
    - cron: "*/20 3-12 * * 1-5"      # every 20 min, about 08:30-18:30 IST, Mon-Fri (GitHub cron is UTC)
  workflow_dispatch: {}              # "Run workflow" button
  push:
    paths: ["data/ipos_manual.json", "data/gmp.csv", "data/config.json"]
permissions:
  contents: write
concurrency:
  group: update-ipo-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                    # always the newest main, even when re-running an old run
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python build_data.py      # if NSE or BSE blocks this server, the script keeps the cached data
      - name: Commit if changed
        run: |
          git config user.name "ipo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A -- ipos.json data
          if git diff --staged --quiet; then echo "Nothing changed, nothing to commit."; exit 0; fi
          git commit -m "Update IPO data"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push attempt $i failed, retrying in 5 seconds"
            sleep 5
          done
          exit 1
