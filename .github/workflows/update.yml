name: Update IPO data
on:
  schedule:
    - cron: "*/20 3-12 * * 1-5"      # every 20 min, about 08:30-18:30 IST, Mon-Fri (GitHub cron is UTC)
  workflow_dispatch: {}              # "Run workflow" button
  push:
    paths: ["data/ipos_manual.json", "data/gmp.csv", "data/config.json"]
permissions:
  contents: write
concurrency:
  group: update-ipo-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python build_data.py          # if NSE blocks this server, the script keeps the cached data
      - name: Commit if changed
        run: |
          git config user.name "ipo-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A -- ipos.json data
          git diff --staged --quiet || (git commit -m "Update IPO data" && git push)
